name: Docs Preview Post-Build

on:
  workflow_run:
    workflows: ["Build Docs Preview"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: preview-post-build-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  read-metadata:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      pr-number: ${{ steps.pr.outputs.PULL_REQUEST }}
      action: ${{ steps.pr.outputs.ACTION }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-preview-build
          path: docs-preview-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve PR metadata
        id: pr
        run: |
          number=$(head -n1 ./docs-preview-build/pr/number | tr -d '[:space:]')
          case "$number" in ''|*[!0-9]*) echo "::error::invalid PR number"; exit 1 ;; esac

          action=$(head -n1 ./docs-preview-build/pr/action | tr -d '[:space:]')
          case "$action" in
            opened|reopened|synchronize|closed) ;;
            *) echo "::error::invalid action: $action"; exit 1 ;;
          esac

          echo "PULL_REQUEST=$number" >> "$GITHUB_OUTPUT"
          echo "ACTION=$action" >> "$GITHUB_OUTPUT"

  deploy:
    needs: read-metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-preview-build
          path: docs-preview-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy PR preview
        id: preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 #1.8.1
        with:
          source-dir: ./docs-preview-build/public
          # previews are being served at the default `pages-base-url`
          # if a cname is added, then the value of said custom domain must be given to `pages-base-url`
          umbrella-dir: pr-preview # must match the /pr-preview/ baseURL the build bakes
          qr-code: false
          comment: false
          action: ${{ needs.read-metadata.outputs.action == 'closed' && 'remove' || 'deploy' }}
          pr-number: ${{ needs.read-metadata.outputs.pr-number }}
          deploy-commit-message: Deploy preview for PR ${{ needs.read-metadata.outputs.pr-number }} 🛫
          remove-commit-message: Remove preview for PR ${{ needs.read-metadata.outputs.pr-number }} 🛬

      - name: Comment preview URL
        if: needs.read-metadata.outputs.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          number: ${{ needs.read-metadata.outputs.pr-number }}
          message: |
            ${{ needs.read-metadata.outputs.action == 'synchronize' && '🔄 Preview updated' || '🚀 Preview deployment' }}: ${{ steps.preview.outputs.preview-url }}
            > *Note: Preview may take a moment (GitHub Pages deployment in progress). Please wait and refresh. Track deployment [here](https://github.com/${{ github.repository }}/actions/workflows/pages/pages-build-deployment)*

      - name: Comment preview removed
        if: needs.read-metadata.outputs.action == 'closed'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          number: ${{ needs.read-metadata.outputs.pr-number }}
          message: 🧹 Preview removed because the pull request was closed.