# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [ "master" ]
  
  # Runs on pull requests for preview deployments
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write # Required to post comments on PRs

# Allow only one concurrent deployment per environment
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-preview-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  # Build job that runs for both main and PR deployments
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Hugo (Extended)
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.147.9'
          extended: true
      
      - name: Install dependencies
        run: make setup
      
      - name: Build Academy for main deployment
        if: github.event_name != 'pull_request'
        run: make build-preview
      
      - name: Build Academy for PR preview
        if: github.event_name == 'pull_request'
        run: hugo --baseURL=https://layer5io.github.io/exoscale-academy/pr-preview-${{ github.event.number }}/
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-site
          path: public/
          retention-days: 1

  # Deploy to main GitHub Pages (for pushes to master and manual triggers)
  deploy-main:
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-site
          path: public/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Deploy PR preview to a unique environment
  deploy-pr-preview:
    needs: build
    if: github.event_name == 'pull_request'
    environment:
      name: pr-preview-${{ github.event.number }}
      url: https://layer5io.github.io/exoscale-academy/pr-preview-${{ github.event.number }}/
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-site
          path: public/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Post comment on PR with preview URL
  comment-pr:
    needs: deploy-pr-preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = 'https://layer5io.github.io/exoscale-academy/pr-preview-${{ github.event.number }}/';
            const body = `🚀 **Preview deployment ready!**
            
            Your changes are now available for preview at: ${previewUrl}
            
            This preview will be updated automatically when you push new commits to this PR.`;
            
            // Check if we already posted a preview comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const existingComment = comments.data.find(comment => 
              comment.body.includes('Preview deployment ready!')
            );
            
            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
