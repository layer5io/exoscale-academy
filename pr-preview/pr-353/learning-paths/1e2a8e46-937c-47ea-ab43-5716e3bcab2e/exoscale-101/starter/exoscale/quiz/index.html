    const build = "development";


    
    function HandleGoBack() {
        window.academyContext?.Router?.back();
    }


    
    const isProdBuild = build === "production"

    if (!isProdBuild) {
        const backBtn = document.getElementById("go-back")

        if (backBtn?.addEventListener) {
            backBtn.addEventListener("click", HandleGoBack);
        }
    }



    
    window.addEventListener("academyContextReady", () => {
        if (isProdBuild && window.academyContext?.RegistrationData?.id) {
            
            const curriculaRoot = window.location.pathname.split("/").slice(0, 5).join("/");
            window.location.replace(`${curriculaRoot}/test?id=${testId}&registration_id=${window.academyContext?.RegistrationData?.id}&test_abs_path=${testAbsPath}`);
            return;
        }
    });

  <div class="academy-image-modal-cont">
    <img class="academy-image-modal-pic" id="modalPic" onclick="closeModal()" style="max-width: 100%; max-height: 80vh; margin: auto;" alt="academy-image-modal-pic">
  </div>

<script>

function openModal(imageIdOrElement) {
  var src;

  if (typeof imageIdOrElement === 'string') {
    
    src = document.getElementById(imageIdOrElement).src;
  } else if (imageIdOrElement instanceof HTMLImageElement) {
    
    src = imageIdOrElement.src;
  }

  if (src && src.includes("#")) {
    src = src.substring(0, src.indexOf("#"));
  }

  document.getElementById("modalPic").src = src;
  document.getElementById("myModal").style.display = "block";
}


function closeModal() { 
  document.getElementById("modalPic").src = "";
  document.getElementById("myModal").style.display = "none";
}


document.addEventListener("keydown", function (event) {
  if (event.key === "Escape") {
    closeModal();
  }
});


document.addEventListener("DOMContentLoaded", function () {
  var imgTags = document.querySelectorAll("img");
  imgTags.forEach(function (img) {
    img.onclick = function () {
      if (img.dataset.modal !== "false") {
        openModal(img);
      }
    };
  });

  
  var modal = document.getElementById("myModal");
  modal.addEventListener("click", function () {
    closeModal();
  });
});
</script>
